<svg xmlns="http://www.w3.org/2000/svg" width="236" height="50" viewBox="0 0 236 50" role="img" aria-label="Connect on LinkedIn">
  <title>Connect on LinkedIn</title>
  <defs>
    <linearGradient id="btnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071929"/>
      <stop offset="50%" stop-color="#0b233a"/>
      <stop offset="100%" stop-color="#081b2d"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Base -->
  <rect x="1.5" y="1.5" width="233" height="47" rx="23.5" fill="url(#btnBg)" stroke="url(#borderGrad)" stroke-width="1.8"/>

  <!-- LinkedIn Icon Tile -->
  <g transform="translate(11, 8)">
    <rect width="34" height="34" rx="7" fill="#0a66c2"/>
    <g transform="translate(5, 5)">
      <path fill="#ffffff" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452z"/>
    </g>
  </g>

  <!-- Text Hierarchy -->
  <text x="56" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.3">LinkedIn</text>
  <text x="56" y="37" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">Connect professionally</text>

  <!-- Arrow Indicator -->
  <g transform="translate(202, 16)">
    <circle cx="9" cy="9" r="9" fill="#0a2540" stroke="#0ea5e9" stroke-width="1"/>
    <path d="M6.5 11.5L11.5 6.5M7.5 6.5H11.5V10.5" fill="none" stroke="#67e8f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
