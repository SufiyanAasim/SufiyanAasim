<svg xmlns="http://www.w3.org/2000/svg" width="254" height="50" viewBox="0 0 254 50" role="img" aria-label="Send an Email via Microsoft Outlook">
  <title>Send an Email via Microsoft Outlook</title>
  <defs>
    <linearGradient id="btnBgMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0d29"/>
      <stop offset="50%" stop-color="#261038"/>
      <stop offset="100%" stop-color="#170923"/>
    </linearGradient>
    <linearGradient id="borderGradMail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glowMail" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Button Base -->
  <rect x="1.5" y="1.5" width="251" height="47" rx="23.5" fill="url(#btnBgMail)" stroke="url(#borderGradMail)" stroke-width="1.8"/>

  <!-- Outlook Icon Tile -->
  <g transform="translate(11, 8)">
    <rect width="34" height="34" rx="10" fill="#0078d4"/>
    <!-- Official Outlook envelope / O geometry -->
    <g transform="translate(4, 5) scale(0.65)">
      <path fill="#ffffff" d="M19.484 7.937v5.477l1.916 1.205a.5.5 0 0 0 .21 0l8.238-5.554a1.174 1.174 0 0 0-.959-1.128Z"/>
      <path fill="#ffffff" d="m19.484 15.457l1.747 1.2a.52.52 0 0 0 .543 0c-.3.181 8.073-5.378 8.073-5.378v10.066a1.408 1.408 0 0 1-1.49 1.555h-8.874zm-9.044-2.525a1.61 1.61 0 0 0-1.42.838a4.13 4.13 0 0 0-.526 2.218A4.05 4.05 0 0 0 9.02 18.2a1.6 1.6 0 0 0 2.771.022a4 4 0 0 0 .515-2.2a4.37 4.37 0 0 0-.5-2.281a1.54 1.54 0 0 0-1.366-.809"/>
      <path fill="#ffffff" d="M2.153 5.155v21.427L18.453 30V2Zm10.908 14.336a3.23 3.23 0 0 1-2.7 1.361a3.19 3.19 0 0 1-2.64-1.318A5.46 5.46 0 0 1 6.706 16.1a5.87 5.87 0 0 1 1.036-3.616a3.27 3.27 0 0 1 2.744-1.384a3.12 3.12 0 0 1 2.61 1.321a5.64 5.64 0 0 1 1 3.484a5.76 5.76 0 0 1-1.035 3.586"/>
    </g>
  </g>

  <!-- Text Hierarchy -->
  <text x="56" y="22" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.3">Microsoft Outlook</text>
  <text x="56" y="37" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">sufiyanaasim@outlook.com</text>

  <!-- Arrow Indicator -->
  <g transform="translate(220, 16)">
    <circle cx="9" cy="9" r="9" fill="#38103c" stroke="#ec4899" stroke-width="1"/>
    <path d="M6.5 11.5L11.5 6.5M7.5 6.5H11.5V10.5" fill="none" stroke="#f472b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
