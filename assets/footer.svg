<svg
  width="854"
  height="210"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 854 210"
  role="img"
  aria-label="Let's talk tech - Connect on LinkedIn or Email via Outlook"
>
  <title>Let's talk tech</title>
  <style>
    .text {
      font-size: 44px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      animation: twinkling 4s ease-in-out infinite;
    }
    .wave-path {
      transform: rotate(180deg);
      transform-origin: 50% 50%;
    }
    @keyframes twinkling {
      40% { opacity: 1; }
      50% { opacity: 0.55; }
      60% { opacity: 1; }
      70% { opacity: 0.55; }
      80% { opacity: 1; }
    }
    .btn-link {
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .btn-link:hover {
      filter: brightness(1.15);
    }
  </style>

  <defs>
    <!-- Wave Gradient: Cyan -> Magenta -> Rose (Reversed horizontally to match screenshot: Rose on left, Cyan on right) -->
    <linearGradient id="waveLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- LinkedIn Button Gradient & Border -->
    <linearGradient id="btnBgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071929" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#0b233a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#081b2d" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="btnBorderLi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Outlook Button Gradient & Border -->
    <linearGradient id="btnBgMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0d29" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#261038" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#170923" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="btnBorderMail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Subtle Button Drop Shadow Filter -->
    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Animated Undulating Wave Background -->
  <g transform="translate(427, 105) scale(1, 1) translate(-427, -105)">
    <!-- Back Wave Layer -->
    <path class="wave-path" d="" fill="url(#waveLinear)" opacity="0.4" transform="scale(-1, 1)" transform-origin="center">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 130Q 213.5 170 427 140T 854 165L 854 0 Z;M0 0L 0 155Q 213.5 170 427 150T 854 140L 854 0 Z;M0 0L 0 175Q 213.5 145 427 175T 854 140L 854 0 Z;M0 0L 0 130Q 213.5 170 427 140T 854 165L 854 0 Z"
      />
    </path>
    <!-- Front Wave Layer -->
    <path class="wave-path" d="" fill="url(#waveLinear)" opacity="0.9" transform="scale(-1, 1)" transform-origin="center">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-10s"
        values="M0 0L 0 145Q 213.5 190 427 160T 854 170L 854 0 Z;M0 0L 0 160Q 213.5 130 427 130T 854 150L 854 0 Z;M0 0L 0 155Q 213.5 135 427 160T 854 175L 854 0 Z;M0 0L 0 145Q 213.5 190 427 160T 854 170L 854 0 Z"
      />
    </path>
  </g>

  <!-- Left Embedded Button: LinkedIn (x=24, y=118, width=228, height=48) -->
  <a class="btn-link" xlink:href="https://www.linkedin.com/in/msufiyanpk" href="https://www.linkedin.com/in/msufiyanpk" target="_blank" rel="noopener noreferrer">
    <g transform="translate(24, 118)" filter="url(#btnShadow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="228" height="48" rx="24" fill="url(#btnBgLi)" stroke="url(#btnBorderLi)" stroke-width="1.8"/>

      <!-- LinkedIn Icon Tile -->
      <g transform="translate(9, 8)">
        <rect width="32" height="32" rx="9" fill="#0a66c2"/>
        <path d="M11.5 12.5a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2zM10 14.5h3.2v9H10zM15 14.5h3.1v1.2h.1c.4-.8 1.5-1.5 3-1.5 3.2 0 3.8 2.1 3.8 4.9v9h-3.2v-4c0-.9 0-2.1-1.3-2.1s-1.5 1-1.5 2v4.1H15z" fill="#ffffff"/>
      </g>

      <!-- Button Text -->
      <text x="50" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.2">LinkedIn</text>
      <text x="50" y="36" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500">Connect professionally</text>

      <!-- Arrow Glyph -->
      <g transform="translate(196, 15)">
        <circle cx="9" cy="9" r="8.5" fill="#0a2540" stroke="#0ea5e9" stroke-width="1"/>
        <path d="M6.5 11.5L11.5 6.5M7.5 6.5H11.5V10.5" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </a>

  <!-- Mid-Left Embedded Button: Microsoft Outlook (x=268, y=118, width=248, height=48) -->
  <a class="btn-link" xlink:href="mailto:sufiyanaasim@outlook.com" href="mailto:sufiyanaasim@outlook.com">
    <g transform="translate(268, 118)" filter="url(#btnShadow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="248" height="48" rx="24" fill="url(#btnBgMail)" stroke="url(#btnBorderMail)" stroke-width="1.8"/>

      <!-- Outlook Icon Tile -->
      <g transform="translate(9, 8)">
        <rect width="32" height="32" rx="9" fill="#0078d4"/>
        <g transform="translate(4, 5) scale(0.62)">
          <path fill="#ffffff" d="M19.484 7.937v5.477l1.916 1.205a.5.5 0 0 0 .21 0l8.238-5.554a1.174 1.174 0 0 0-.959-1.128Z"/>
          <path fill="#ffffff" d="m19.484 15.457l1.747 1.2a.52.52 0 0 0 .543 0c-.3.181 8.073-5.378 8.073-5.378v10.066a1.408 1.408 0 0 1-1.49 1.555h-8.874zm-9.044-2.525a1.61 1.61 0 0 0-1.42.838a4.13 4.13 0 0 0-.526 2.218A4.05 4.05 0 0 0 9.02 18.2a1.6 1.6 0 0 0 2.771.022a4 4 0 0 0 .515-2.2a4.37 4.37 0 0 0-.5-2.281a1.54 1.54 0 0 0-1.366-.809"/>
          <path fill="#ffffff" d="M2.153 5.155v21.427L18.453 30V2Zm10.908 14.336a3.23 3.23 0 0 1-2.7 1.361a3.19 3.19 0 0 1-2.64-1.318A5.46 5.46 0 0 1 6.706 16.1a5.87 5.87 0 0 1 1.036-3.616a3.27 3.27 0 0 1 2.744-1.384a3.12 3.12 0 0 1 2.61 1.321a5.64 5.64 0 0 1 1 3.484a5.76 5.76 0 0 1-1.035 3.586"/>
        </g>
      </g>

      <!-- Button Text -->
      <text x="50" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="0.2">Microsoft Outlook</text>
      <text x="50" y="36" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500">sufiyanaasim@outlook.com</text>

      <!-- Arrow Glyph -->
      <g transform="translate(216, 15)">
        <circle cx="9" cy="9" r="8.5" fill="#38103c" stroke="#ec4899" stroke-width="1"/>
        <path d="M6.5 11.5L11.5 6.5M7.5 6.5H11.5V10.5" fill="none" stroke="#f472b6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </a>

  <!-- Right Side Call-to-Action Text: let's talk tech! (x=73%, y=68%) -->
  <text text-anchor="middle" dominant-baseline="middle" x="73%" y="68%" class="text" fill="#ffffff" stroke="none">let's talk tech!</text>
</svg>
