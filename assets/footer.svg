<svg
  width="1000"
  height="210"
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  style="z-index:1;position:relative"
  viewBox="0 0 1000 210"
  role="img"
  aria-label="Let's talk tech - Connect on LinkedIn or Email via Outlook"
>
  <title>Let's talk tech</title>
  <style>
    .text {
      font-size: 40px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
      animation: twinkling 4s ease-in-out infinite;
    }
    .wave-path {
      transform: rotate(180deg);
      transform-origin: 50% 50%;
    }
    @keyframes twinkling {
      40% { opacity: 1; }
      50% { opacity: 0.55; }
      60% { opacity: 1; }
      70% { opacity: 0.55; }
      80% { opacity: 1; }
    }
    .btn-link {
      cursor: pointer;
    }
    .btn-link:hover {
      filter: brightness(1.18);
    }
  </style>

  <defs>
    <!-- Wave Gradient: Cyan -> Magenta -> Rose (Reversed horizontally: Rose on left, Cyan on right) -->
    <linearGradient id="waveLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- LinkedIn Button Gradient & Border -->
    <linearGradient id="btnBgLi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071929" stop-opacity="0.94"/>
      <stop offset="50%" stop-color="#0b233a" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#081b2d" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="btnBorderLi" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b5"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- Outlook Button Gradient & Border -->
    <linearGradient id="btnBgMail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0d29" stop-opacity="0.94"/>
      <stop offset="50%" stop-color="#261038" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#170923" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="btnBorderMail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Embedded Buttons -->
    <filter id="btnShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Animated Undulating Wave Background -->
  <g transform="translate(500, 105) scale(1, 1) translate(-500, -105)">
    <!-- Back Wave Layer -->
    <path class="wave-path" d="" fill="url(#waveLinear)" opacity="0.4" transform="scale(-1, 1)" transform-origin="center">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="0s"
        values="M0 0L 0 130Q 250 170 500 140T 1000 165L 1000 0 Z;M0 0L 0 155Q 250 170 500 150T 1000 140L 1000 0 Z;M0 0L 0 175Q 250 145 500 175T 1000 140L 1000 0 Z;M0 0L 0 130Q 250 170 500 140T 1000 165L 1000 0 Z"
      />
    </path>
    <!-- Front Wave Layer -->
    <path class="wave-path" d="" fill="url(#waveLinear)" opacity="0.9" transform="scale(-1, 1)" transform-origin="center">
      <animate
        attributeName="d"
        dur="20s"
        repeatCount="indefinite"
        keyTimes="0;0.333;0.667;1"
        calcMode="spline"
        keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
        begin="-10s"
        values="M0 0L 0 145Q 250 190 500 160T 1000 170L 1000 0 Z;M0 0L 0 160Q 250 130 500 130T 1000 150L 1000 0 Z;M0 0L 0 155Q 250 135 500 160T 1000 175L 1000 0 Z;M0 0L 0 145Q 250 190 500 160T 1000 170L 1000 0 Z"
      />
    </path>
  </g>

  <!-- Left Embedded Button: LinkedIn (x=30, y=117, width=210, height=46) -->
  <a class="btn-link" xlink:href="https://www.linkedin.com/in/msufiyanpk" href="https://www.linkedin.com/in/msufiyanpk" target="_blank" rel="noopener noreferrer">
    <g transform="translate(30, 117)" filter="url(#btnShadow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="210" height="46" rx="23" fill="url(#btnBgLi)" stroke="url(#btnBorderLi)" stroke-width="1.8"/>

      <!-- Official LinkedIn Icon Tile -->
      <g transform="translate(8, 7)">
        <rect width="32" height="32" rx="6" fill="#0a66c2"/>
        <g transform="translate(4, 4)">
          <path fill="#ffffff" d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452z"/>
        </g>
      </g>

      <!-- Button Text -->
      <text x="48" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">LinkedIn</text>
      <text x="48" y="34" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500">Connect professionally</text>

      <!-- Arrow Glyph -->
      <g transform="translate(180, 15)">
        <circle cx="8" cy="8" r="7.5" fill="#0a2540" stroke="#0ea5e9" stroke-width="1"/>
        <path d="M5.5 10.5L10.5 5.5M6.5 5.5H10.5V9.5" fill="none" stroke="#67e8f9" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </a>

  <!-- Mid-Left Embedded Button: Microsoft Outlook (x=256, y=117, width=230, height=46) -->
  <a class="btn-link" xlink:href="mailto:sufiyanaasim@outlook.com" href="mailto:sufiyanaasim@outlook.com">
    <g transform="translate(256, 117)" filter="url(#btnShadow)">
      <!-- Pill Container -->
      <rect x="0" y="0" width="230" height="46" rx="23" fill="url(#btnBgMail)" stroke="url(#btnBorderMail)" stroke-width="1.8"/>

      <!-- Outlook Icon Tile -->
      <g transform="translate(8, 7)">
        <rect width="32" height="32" rx="9" fill="#0078d4"/>
        <g transform="translate(4, 5) scale(0.62)">
          <path fill="#ffffff" d="M19.484 7.937v5.477l1.916 1.205a.5.5 0 0 0 .21 0l8.238-5.554a1.174 1.174 0 0 0-.959-1.128Z"/>
          <path fill="#ffffff" d="m19.484 15.457l1.747 1.2a.52.52 0 0 0 .543 0c-.3.181 8.073-5.378 8.073-5.378v10.066a1.408 1.408 0 0 1-1.49 1.555h-8.874zm-9.044-2.525a1.61 1.61 0 0 0-1.42.838a4.13 4.13 0 0 0-.526 2.218A4.05 4.05 0 0 0 9.02 18.2a1.6 1.6 0 0 0 2.771.022a4 4 0 0 0 .515-2.2a4.37 4.37 0 0 0-.5-2.281a1.54 1.54 0 0 0-1.366-.809"/>
          <path fill="#ffffff" d="M2.153 5.155v21.427L18.453 30V2Zm10.908 14.336a3.23 3.23 0 0 1-2.7 1.361a3.19 3.19 0 0 1-2.64-1.318A5.46 5.46 0 0 1 6.706 16.1a5.87 5.87 0 0 1 1.036-3.616a3.27 3.27 0 0 1 2.744-1.384a3.12 3.12 0 0 1 2.61 1.321a5.64 5.64 0 0 1 1 3.484a5.76 5.76 0 0 1-1.035 3.586"/>
        </g>
      </g>

      <!-- Button Text -->
      <text x="48" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="0.2">Microsoft Outlook</text>
      <text x="48" y="34" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="500">sufiyanaasim@outlook.com</text>

      <!-- Arrow Glyph -->
      <g transform="translate(200, 15)">
        <circle cx="8" cy="8" r="7.5" fill="#38103c" stroke="#ec4899" stroke-width="1"/>
        <path d="M5.5 10.5L10.5 5.5M6.5 5.5H10.5V9.5" fill="none" stroke="#f472b6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </a>

  <!-- Right Side Call-to-Action Text: let's talk tech! (centered at x=780, y=140 with massive clearance) -->
  <text text-anchor="middle" dominant-baseline="central" x="780" y="140" class="text" fill="#ffffff" stroke="none">let's talk tech!</text>
</svg>
