<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Sufiyan Aasim</title>
  <desc id="desc">Software Engineer building intelligent systems</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.48" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="28" fill="url(#background)"/>
  <rect width="1200" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="110" cy="55" r="250" fill="url(#cyanGlow)"/>
  <circle cx="1080" cy="310" r="285" fill="url(#purpleGlow)"/>

  <g opacity="0.82" stroke="url(#accent)" fill="none">
    <path d="M55 264 C168 195 250 295 360 226 S568 180 660 224" stroke-width="2"/>
    <path d="M780 82 C870 24 946 128 1145 62" stroke-width="2"/>
    <circle cx="55" cy="264" r="6" fill="#22d3ee"/>
    <circle cx="360" cy="226" r="6" fill="#8b5cf6"/>
    <circle cx="660" cy="224" r="6" fill="#f472b6"/>
    <circle cx="780" cy="82" r="6" fill="#22d3ee"/>
    <circle cx="1145" cy="62" r="6" fill="#f472b6"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <text x="600" y="112" fill="#67e8f9" font-size="20" font-weight="600" letter-spacing="5">HELLO, I BUILD SOFTWARE</text>
    <text x="600" y="184" fill="#f8fafc" font-size="52" font-weight="750" filter="url(#softGlow)">Mohammad Sufiyan Aasim</text>
    <rect x="356" y="209" width="488" height="4" rx="2" fill="url(#accent)"/>
    <text x="600" y="256" fill="#cbd5e1" font-size="23" font-weight="500" letter-spacing="1.2">SOFTWARE ENGINEERING  ·  QUALITY  ·  AI &amp; DATA</text>
    <text x="600" y="297" fill="#94a3b8" font-size="16" letter-spacing="3">KARACHI  /  PAKISTAN</text>
  </g>

  <rect x="1.5" y="1.5" width="1197" height="337" rx="26.5" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>
</svg>
