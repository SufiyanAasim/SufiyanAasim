  </g>
  <g fill="#fde68a" opacity="0.7">
    <rect x="143" y="111" width="7" height="7"/><rect x="159" y="111" width="7" height="7"/><rect x="143" y="128" width="7" height="7"/>
    <rect x="307" y="98" width="7" height="7"/><rect x="323" y="98" width="7" height="7"/><rect x="307" y="116" width="7" height="7"/>
    <rect x="469" y="108" width="7" height="7"/><rect x="485" y="108" width="7" height="7"/>
  </g>
