<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Build, test, ride, ship</title>
  <desc id="desc">A neon developer workspace overlooking Karachi with a motorcycle ready for the next ride</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19183b"/>
      <stop offset="0.58" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.52" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes bikeLevitate {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(34,211,238,0.7)); }
        50% { filter: drop-shadow(0 0 14px rgba(244,114,182,0.95)); }
      }
      @keyframes screenGlow {
        0%, 100% { stroke: #22d3ee; filter: drop-shadow(0 0 4px rgba(34,211,238,0.4)); }
        50% { stroke: #f472b6; filter: drop-shadow(0 0 9px rgba(244,114,182,0.8)); }
      }
      @keyframes codeScroll {
        0%, 100% { opacity: 0.85; transform: translateX(0px); }
        50% { opacity: 1; transform: translateX(4px); }
      }
      @keyframes sunPulse {
        0%, 100% { opacity: 0.85; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.06); }
      }
      @keyframes windowLight {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 0.15; }
      }
      .neon-bike { animation: bikeLevitate 3.2s infinite ease-in-out, neonPulse 4s infinite ease-in-out; transform-origin: center; }
      .wheel-rear { animation: wheelSpin 3.5s infinite linear; transform-origin: 384px 299px; }
      .wheel-front { animation: wheelSpin 3.5s infinite linear; transform-origin: 552px 299px; }
      .monitor-border { animation: screenGlow 5s infinite ease-in-out; }
      .code-lines { animation: codeScroll 2.8s infinite ease-in-out; }
      .sun { animation: sunPulse 6s infinite ease-in-out; transform-origin: 510px 68px; }
      .city-lights rect { animation: windowLight 3.6s infinite ease-in-out; }
      .city-lights rect:nth-child(2n) { animation-delay: 1.2s; }
      .city-lights rect:nth-child(3n) { animation-delay: 2.4s; }
    </style>
  </defs>

  <rect width="640" height="360" rx="18" fill="#0b1120"/>
  <rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Window and skyline -->
  <rect x="22" y="22" width="596" height="184" rx="10" fill="url(#sunset)"/>
  <circle class="sun" cx="510" cy="68" r="30" fill="#fef3c7"/>
  <g fill="#312e81" opacity="0.92">
    <path d="M22 153h42v-34h26v34h38V94h44v59h28v-47h51v47h38v-73h46v73h36v-44h47v44h36V91h52v62h39v-30h45v83H22z"/>
  </g>
  <g class="city-lights" fill="#fde68a">
    <rect x="143" y="111" width="7" height="7"/><rect x="159" y="111" width="7" height="7"/><rect x="143" y="128" width="7" height="7"/>
    <rect x="307" y="98" width="7" height="7"/><rect x="323" y="98" width="7" height="7"/><rect x="307" y="116" width="7" height="7"/>
    <rect x="469" y="108" width="7" height="7"/><rect x="485" y="108" width="7" height="7"/>
  </g>
  <path d="M22 176 C130 144 220 195 332 160 S520 144 618 168 V206 H22z" fill="#0f766e" opacity="0.68"/>
  <rect x="310" y="22" width="10" height="184" fill="#111827"/>
  <rect x="22" y="198" width="596" height="8" fill="#111827"/>

  <!-- Coding desk -->
  <rect x="54" y="216" width="250" height="13" rx="4" fill="#475569"/>
  <rect x="72" y="229" width="14" height="95" fill="#334155"/>
  <rect x="274" y="229" width="14" height="95" fill="#334155"/>
  <rect class="monitor-border" x="105" y="146" width="142" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
  <rect x="114" y="155" width="124" height="62" rx="3" fill="url(#night)"/>
  <g class="code-lines">
    <path d="M128 169h42M128 182h70M128 195h56" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
    <path d="M182 169h37M210 182h16M192 195h34" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="168" y="226" width="18" height="18" fill="#334155"/>
  <rect x="140" y="241" width="74" height="8" rx="4" fill="#475569"/>
  <path d="M78 211h62" stroke="#a78bfa" stroke-width="5"/><path d="M85 200h50" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="267" cy="203" r="12" fill="#111827" stroke="#f472b6" stroke-width="3"/>
  <path d="M258 200q9-14 18 0" fill="none" stroke="#f472b6" stroke-width="3"/>

  <!-- Neon motorcycle -->
  <g class="neon-bike" filter="url(#neon)">
    <g class="wheel-rear">
      <circle cx="384" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
      <circle cx="384" cy="299" r="27" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 8"/>
      <circle cx="384" cy="299" r="16" fill="none" stroke="#f472b6" stroke-width="2" stroke-dasharray="6 6"/>
    </g>
    <g class="wheel-front">
      <circle cx="552" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
      <circle cx="552" cy="299" r="27" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="12 8"/>
      <circle cx="552" cy="299" r="16" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6 6"/>
    </g>
    <path d="M384 299 L430 244 L492 247 L526 299 L450 299 Z" fill="none" stroke="url(#bike)" stroke-width="8" stroke-linejoin="round"/>
    <path d="M430 244 L414 223 L468 223 L492 247" fill="#7c3aed" stroke="#a78bfa" stroke-width="4"/>
    <path d="M466 221 Q494 198 520 222 L499 248 H464z" fill="#0891b2" stroke="#67e8f9" stroke-width="4"/>
    <path d="M511 219 L536 203 M530 203h24" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <path d="M522 223 L552 299" stroke="#f472b6" stroke-width="6"/>
    <rect x="418" y="216" width="56" height="9" rx="4" fill="#111827" stroke="#c4b5fd" stroke-width="3"/>
    <circle cx="457" cy="278" r="22" fill="#111827" stroke="#fbbf24" stroke-width="4"/>
    <circle cx="535" cy="223" r="8" fill="#fef08a"/>
  </g>

  <!-- Helmet and caption -->
  <path d="M326 229q0-32 30-32t30 32v18h-60z" fill="#111827" stroke="#22d3ee" stroke-width="4"/>
  <path d="M347 205q24 2 30 22h-30z" fill="#67e8f9" opacity="0.65"/>
  <text x="179" y="342" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="15" letter-spacing="2.5">BUILD · TEST · RIDE · SHIP</text>
</svg>
