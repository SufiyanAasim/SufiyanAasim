<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Build, test, ride, ship</title>
  <desc id="desc">A neon developer workspace overlooking Karachi with a motorcycle ready for the next ride</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#19183b"/>
      <stop offset="0.58" stop-color="#4c1d95"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="0.52" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bike" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="neon"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes bikeLevitate {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(34,211,238,0.7)); }
        50% { filter: drop-shadow(0 0 16px rgba(244,114,182,0.95)); }
      }
      @keyframes screenGlow {
        0%, 100% { stroke: #22d3ee; filter: drop-shadow(0 0 4px rgba(34,211,238,0.4)); }
        50% { stroke: #f472b6; filter: drop-shadow(0 0 9px rgba(244,114,182,0.8)); }
      }
      @keyframes codeScroll {
        0%, 100% { opacity: 0.85; transform: translateX(0px); }
        50% { opacity: 1; transform: translateX(4px); }
      }
      @keyframes skyFade {
        0%, 35% { opacity: 0; }
        50%, 85% { opacity: 1; }
        100% { opacity: 0; }
      }
      @keyframes sunCycle {
        0%, 35% { opacity: 0.9; transform: translateY(0px) scale(1); }
        50%, 85% { opacity: 0; transform: translateY(70px) scale(0.7); }
        100% { opacity: 0.9; transform: translateY(0px) scale(1); }
      }
      @keyframes moonCycle {
        0%, 35% { opacity: 0; transform: translateY(-50px) scale(0.8); }
        50%, 85% { opacity: 0.95; transform: translateY(0px) scale(1); }
        100% { opacity: 0; transform: translateY(-50px) scale(0.8); }
      }
      @keyframes starTwinkle {
        0%, 38% { opacity: 0; }
        50%, 82% { opacity: 0.85; }
        100% { opacity: 0; }
      }
      @keyframes cloudDrift1 {
        0% { transform: translateX(-120px); }
        100% { transform: translateX(650px); }
      }
      @keyframes cloudDrift2 {
        0% { transform: translateX(-200px); }
        100% { transform: translateX(650px); }
      }
      @keyframes windowLight {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 0.15; }
      }
      @keyframes exhaustFlame {
        0%, 100% { opacity: 0.4; transform: scaleX(0.8); }
        50% { opacity: 1; transform: scaleX(1.3); stroke: #f472b6; }
      }
      .neon-bike { animation: bikeLevitate 3.2s infinite ease-in-out, neonPulse 4s infinite ease-in-out; transform-origin: center; }
      .wheel-rear { animation: wheelSpin 3.2s infinite linear; transform-origin: 384px 299px; }
      .wheel-front { animation: wheelSpin 3.2s infinite linear; transform-origin: 552px 299px; }
      .monitor-border { animation: screenGlow 5s infinite ease-in-out; }
      .code-lines { animation: codeScroll 2.8s infinite ease-in-out; }
      .night-sky { animation: skyFade 16s infinite ease-in-out; }
      .sun { animation: sunCycle 16s infinite ease-in-out; transform-origin: 510px 68px; }
      .moon { animation: moonCycle 16s infinite ease-in-out; transform-origin: 510px 68px; }
      .star-field { animation: starTwinkle 16s infinite ease-in-out; }
      .cloud1 { animation: cloudDrift1 22s infinite linear; }
      .cloud2 { animation: cloudDrift2 30s infinite linear; }
      .city-lights rect { animation: windowLight 3.6s infinite ease-in-out; }
      .city-lights rect:nth-child(2n) { animation-delay: 1.2s; }
      .city-lights rect:nth-child(3n) { animation-delay: 2.4s; }
      .flame { animation: exhaustFlame 0.3s infinite alternate ease-in-out; transform-origin: 430px 297px; }
    </style>
  </defs>

  <rect width="640" height="360" rx="18" fill="#0b1120"/>
  <rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

  <!-- Window and Day-to-Night Skyline -->
  <g clip-path="url(#window-clip)">
    <defs>
      <clipPath id="window-clip">
        <rect x="22" y="22" width="596" height="184" rx="10"/>
      </clipPath>
    </defs>
    <!-- Day/Sunset Base Sky -->
    <rect x="22" y="22" width="596" height="184" fill="url(#sunset)"/>
    <!-- Night Overlay Sky -->
    <rect class="night-sky" x="22" y="22" width="596" height="184" fill="url(#night)"/>
    <!-- Sun -->
    <circle class="sun" cx="510" cy="68" r="30" fill="#fef3c7"/>
    <!-- Moon and Stars -->
    <g class="star-field">
      <circle cx="80" cy="50" r="1.5" fill="#f8fafc"/><circle cx="150" cy="70" r="2" fill="#fde68a"/><circle cx="230" cy="45" r="1.5" fill="#f8fafc"/>
      <circle cx="340" cy="60" r="2" fill="#f8fafc"/><circle cx="420" cy="40" r="1.5" fill="#fde68a"/><circle cx="580" cy="55" r="2" fill="#f8fafc"/>
      <circle cx="280" cy="80" r="1.5" fill="#67e8f9"/><circle cx="460" cy="75" r="1.5" fill="#f472b6"/>
    </g>
    <path class="moon" d="M495 52 A 22 22 0 1 0 522 79 A 26 26 0 1 1 495 52 Z" fill="#fef08a" filter="url(#neon)"/>
    <!-- Drifting Clouds -->
    <g class="cloud1" fill="#f8fafc" opacity="0.35">
      <path d="M0 85 Q20 70 40 85 Q60 70 80 85 Q100 70 120 85 V96 H0 Z" rx="10"/>
    </g>
    <g class="cloud2" fill="#fde68a" opacity="0.25">
      <path d="M0 115 Q25 98 50 115 Q75 98 100 115 Q125 98 150 115 V126 H0 Z" rx="10"/>
    </g>
  </g>

  <g fill="#312e81" opacity="0.92">
    <path d="M22 153h42v-34h26v34h38V94h44v59h28v-47h51v47h38v-73h46v73h36v-44h47v44h36V91h52v62h39v-30h45v83H22z"/>
  </g>
  <g class="city-lights" fill="#fde68a">
    <rect x="143" y="111" width="7" height="7"/><rect x="159" y="111" width="7" height="7"/><rect x="143" y="128" width="7" height="7"/>
    <rect x="307" y="98" width="7" height="7"/><rect x="323" y="98" width="7" height="7"/><rect x="307" y="116" width="7" height="7"/>
    <rect x="469" y="108" width="7" height="7"/><rect x="485" y="108" width="7" height="7"/>
  </g>
  <path d="M22 176 C130 144 220 195 332 160 S520 144 618 168 V206 H22z" fill="#0f766e" opacity="0.68"/>
  <rect x="310" y="22" width="10" height="184" fill="#111827"/>
  <rect x="22" y="198" width="596" height="8" fill="#111827"/>

  <!-- Coding desk -->
  <rect x="54" y="216" width="250" height="13" rx="4" fill="#475569"/>
  <rect x="72" y="229" width="14" height="95" fill="#334155"/>
  <rect x="274" y="229" width="14" height="95" fill="#334155"/>
  <rect class="monitor-border" x="105" y="146" width="142" height="80" rx="6" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
  <rect x="114" y="155" width="124" height="62" rx="3" fill="url(#night)"/>
  <g class="code-lines">
    <path d="M128 169h42M128 182h70M128 195h56" stroke="#67e8f9" stroke-width="5" stroke-linecap="round"/>
    <path d="M182 169h37M210 182h16M192 195h34" stroke="#f472b6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="168" y="226" width="18" height="18" fill="#334155"/>
  <rect x="140" y="241" width="74" height="8" rx="4" fill="#475569"/>
  <path d="M78 211h62" stroke="#a78bfa" stroke-width="5"/><path d="M85 200h50" stroke="#22d3ee" stroke-width="4"/>
  <circle cx="267" cy="203" r="12" fill="#111827" stroke="#f472b6" stroke-width="3"/>
  <path d="M258 200q9-14 18 0" fill="none" stroke="#f472b6" stroke-width="3"/>

  <!-- Neon Cyberpunk Superbike -->
  <g class="neon-bike" filter="url(#neon)">
    <!-- Neon Underglow -->
    <ellipse cx="468" cy="318" rx="80" ry="6" fill="#f472b6" opacity="0.45" filter="url(#neon)"/>
    <!-- Rear Wheel & Drilled Brake Disc Rotor -->
    <g class="wheel-rear">
      <circle cx="384" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
      <circle cx="384" cy="299" r="27" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 8"/>
      <circle cx="384" cy="299" r="19" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4"/>
    </g>
    <rect x="368" y="280" width="12" height="18" rx="3" fill="#f472b6" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Front Wheel & Drilled Brake Disc Rotor -->
    <g class="wheel-front">
      <circle cx="552" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
      <circle cx="552" cy="299" r="27" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="12 8"/>
      <circle cx="552" cy="299" r="19" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4"/>
    </g>
    <rect x="536" y="280" width="12" height="18" rx="3" fill="#22d3ee" stroke="#f8fafc" stroke-width="1.5"/>
    <!-- Twin-Spar Sportbike Frame -->
    <path d="M384 299 L430 238 L496 242 L532 299 L454 299 Z" fill="none" stroke="url(#bike)" stroke-width="9" stroke-linejoin="round"/>
    <!-- Aerodynamic Belly Pan Cowl -->
    <path d="M440 299 L516 299 L528 280 L444 280 Z" fill="#4c1d95" stroke="#f472b6" stroke-width="3" stroke-linejoin="round"/>
    <!-- Sharp High Tail & LED Taillight -->
    <path d="M430 238 L396 214 L440 214 L464 238 Z" fill="#7c3aed" stroke="#a78bfa" stroke-width="4"/>
    <path d="M396 214 L378 220 L396 226 Z" fill="#fb7185" filter="url(#neon)"/>
    <!-- Muscular Superbike Fuel Tank & Split Sport Seat -->
    <path d="M440 214 Q468 190 496 216 L480 242 H440 Z" fill="#1e1b4b" stroke="#c4b5fd" stroke-width="3.5"/>
    <rect x="424" y="210" width="28" height="8" rx="4" fill="#0b1120" stroke="#c4b5fd" stroke-width="2"/>
    <!-- Aggressive Sportbike Front Fairing Cowl -->
    <path d="M480 242 L524 212 L558 220 L532 299 L480 280 Z" fill="#0891b2" stroke="#67e8f9" stroke-width="4" stroke-linejoin="round"/>
    <!-- Dual LED Cyberpunk Headlights & Clip-on Handlebars -->
    <path d="M536 218 L564 210 M540 226 L566 220" stroke="#fef08a" stroke-width="5" stroke-linecap="round" filter="url(#neon)"/>
    <path d="M496 216 L524 200 H542" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
    <!-- Racing Canister Exhaust & Plasma Flame Pulse -->
    <path d="M430 292 L468 274 L476 284 L438 302 Z" fill="#334155" stroke="#fbbf24" stroke-width="3"/>
    <path class="flame" d="M430 297 L406 302" stroke="#67e8f9" stroke-width="6" stroke-linecap="round" filter="url(#neon)"/>
  </g>

  <!-- Helmet and caption -->
  <path d="M326 229q0-32 30-32t30 32v18h-60z" fill="#111827" stroke="#22d3ee" stroke-width="4"/>
  <path d="M347 205q24 2 30 22h-30z" fill="#67e8f9" opacity="0.65"/>
  <text x="179" y="342" text-anchor="middle" fill="#cbd5e1" font-family="Consolas, monospace" font-size="15" letter-spacing="2.5">BUILD · TEST · RIDE · SHIP</text>
</svg>
