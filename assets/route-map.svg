<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Career route map</title>
  <desc id="desc">A GPS-style route from SQA Analyst through SQA Engineer, SDET, Data Sciences, and Data Mining to AI/ML Ops, with a motorcycle marking the current checkpoint and open to affiliation work</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="road-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="0.5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes roadFlow {
        0% { stroke-dashoffset: 30; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarPing {
        0% { r: 9px; opacity: 0.9; stroke-width: 3px; }
        100% { r: 22px; opacity: 0; stroke-width: 1px; }
      }
      @keyframes wheelSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bikeHover {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes exhaustPulse {
        0%, 100% { opacity: 0.4; transform: scaleX(0.8); }
        50% { opacity: 1; transform: scaleX(1.3); stroke: #f472b6; }
      }
      .road-animated { animation: roadFlow 1.1s linear infinite; }
      .ping1 { animation: radarPing 2.6s infinite 0.0s ease-out; transform-origin: 50px 280px; }
      .ping2 { animation: radarPing 2.6s infinite 0.4s ease-out; transform-origin: 150px 220px; }
      .ping3 { animation: radarPing 2.6s infinite 0.8s ease-out; transform-origin: 260px 250px; }
      .ping4 { animation: radarPing 2.6s infinite 1.2s ease-out; transform-origin: 370px 180px; }
      .ping5 { animation: radarPing 2.6s infinite 1.6s ease-out; transform-origin: 480px 140px; }
      .ping6 { animation: radarPing 2.6s infinite 2.0s ease-out; transform-origin: 580px 85px; }
      .bike-hover { animation: bikeHover 2.6s infinite ease-in-out; }
      .wheel-rear { animation: wheelSpin 3.2s infinite linear; transform-origin: 384px 299px; }
      .wheel-front { animation: wheelSpin 3.2s infinite linear; transform-origin: 552px 299px; }
      .exhaust-line { animation: exhaustPulse 0.3s infinite alternate ease-in-out; transform-origin: 430px 297px; }
    </style>
  </defs>

  <rect width="640" height="360" rx="18" fill="url(#sky)"/>
  <rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>

  <text x="32" y="38" fill="#f8fafc" font-family="Consolas, monospace" font-size="17" font-weight="700">career route map: 6 strategic checkpoints</text>
  <text x="32" y="60" fill="#38bdf8" font-family="Consolas, monospace" font-size="13" font-weight="700">progression: SQA Analyst &#8594; SDET &#8594; Data Sciences &#8594; AI/ML Ops</text>

  <!-- Winding Dynamic Circuit Path -->
  <path d="M 50 280 C 100 280, 110 220, 150 220 C 190 220, 220 250, 260 250 C 300 250, 330 180, 370 180 C 410 180, 440 140, 480 140 C 520 140, 550 85, 580 85"
        fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
  <path class="road-animated" d="M 50 280 C 100 280, 110 220, 150 220 C 190 220, 220 250, 260 250 C 300 250, 330 180, 370 180 C 410 180, 440 140, 480 140 C 520 140, 550 85, 580 85"
        fill="none" stroke="url(#road-glow)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 10" filter="url(#soft)"/>

  <!-- Waypoint 01 -->
  <circle class="ping1" cx="50" cy="280" r="9" fill="none" stroke="#0891b2"/>
  <circle cx="50" cy="280" r="9" fill="#0b1120" stroke="#0891b2" stroke-width="3"/>
  <text x="30" y="310" text-anchor="start" fill="#67e8f9" font-family="Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="30" y="326" text-anchor="start" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">SQA Analyst</text>

  <!-- Waypoint 02 -->
  <circle class="ping2" cx="150" cy="220" r="9" fill="none" stroke="#38bdf8"/>
  <circle cx="150" cy="220" r="9" fill="#0b1120" stroke="#38bdf8" stroke-width="3"/>
  <text x="150" y="192" text-anchor="middle" fill="#7dd3fc" font-family="Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="150" y="247" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">SQA Engineer</text>

  <!-- Waypoint 03 -->
  <circle class="ping3" cx="260" cy="250" r="9" fill="none" stroke="#818cf8"/>
  <circle cx="260" cy="250" r="9" fill="#0b1120" stroke="#818cf8" stroke-width="3"/>
  <text x="260" y="280" text-anchor="middle" fill="#a5b4fc" font-family="Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="260" y="296" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">SDET</text>

  <!-- Waypoint 04 -->
  <circle class="ping4" cx="370" cy="180" r="9" fill="none" stroke="#06b6d4"/>
  <circle cx="370" cy="180" r="9" fill="#0b1120" stroke="#06b6d4" stroke-width="3"/>
  <text x="370" y="152" text-anchor="middle" fill="#22d3ee" font-family="Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="370" y="207" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Data Sciences</text>

  <!-- Waypoint 05 -->
  <circle class="ping5" cx="480" cy="140" r="9" fill="none" stroke="#f97316"/>
  <circle cx="480" cy="140" r="9" fill="#0b1120" stroke="#f97316" stroke-width="3"/>
  <text x="480" y="112" text-anchor="middle" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">05</text>
  <text x="480" y="167" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Data Mining</text>

  <!-- Waypoint 06 - current, with Cyberpunk Superbike parked cleanly right above -->
  <g filter="url(#soft)">
    <circle class="ping6" cx="580" cy="85" r="12" fill="none" stroke="#fbbf24"/>
    <circle cx="580" cy="85" r="12" fill="#0b1120" stroke="#fbbf24" stroke-width="3"/>
    <circle cx="580" cy="85" r="5" fill="#fef08a"/>
  </g>
  <g transform="translate(383, -34) scale(0.42)" filter="url(#soft)">
    <g class="bike-hover">
      <defs>
        <radialGradient id="sun-shadow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f97316" stop-opacity="0.85"/>
          <stop offset="60%" stop-color="#ea580c" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cyan-body" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#67e8f9"/>
          <stop offset="1" stop-color="#0891b2"/>
        </linearGradient>
      </defs>
      <!-- Warm Orange Sun Shadow / Underglow -->
      <ellipse cx="468" cy="318" rx="84" ry="10" fill="url(#sun-shadow)" filter="url(#soft)"/>
      <!-- Rear Wheel & Drilled Brake Disc Rotor -->
      <g class="wheel-rear">
        <circle cx="384" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
        <circle cx="384" cy="299" r="27" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="12 8"/>
        <circle cx="384" cy="299" r="19" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4"/>
      </g>
      <rect x="368" y="280" width="12" height="18" rx="3" fill="#f97316" stroke="#f8fafc" stroke-width="1.5"/>
      <!-- Front Wheel & Drilled Brake Disc Rotor -->
      <g class="wheel-front">
        <circle cx="552" cy="299" r="42" fill="#0b1120" stroke="#64748b" stroke-width="8"/>
        <circle cx="552" cy="299" r="27" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="12 8"/>
        <circle cx="552" cy="299" r="19" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="4 4"/>
      </g>
      <rect x="536" y="280" width="12" height="18" rx="3" fill="#22d3ee" stroke="#f8fafc" stroke-width="1.5"/>
      <!-- Twin-Spar Sportbike Frame -->
      <path d="M384 299 L430 238 L496 242 L532 299 L454 299 Z" fill="none" stroke="url(#cyan-body)" stroke-width="9" stroke-linejoin="round"/>
      <!-- Aerodynamic Belly Pan Cowl -->
      <path d="M440 299 L516 299 L528 280 L444 280 Z" fill="#0f172a" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
      <!-- Sharp High Tail & LED Taillight -->
      <path d="M430 238 L396 214 L440 214 L464 238 Z" fill="#0891b2" stroke="#67e8f9" stroke-width="4"/>
      <path d="M396 214 L378 220 L396 226 Z" fill="#f97316" filter="url(#soft)"/>
      <!-- Muscular Superbike Fuel Tank & Split Sport Seat -->
      <path d="M440 214 Q468 190 496 216 L480 242 H440 Z" fill="#0f172a" stroke="#67e8f9" stroke-width="3.5"/>
      <rect x="424" y="210" width="28" height="8" rx="4" fill="#0b1120" stroke="#67e8f9" stroke-width="2"/>
      <!-- Aggressive Sportbike Front Fairing Cowl -->
      <path d="M480 242 L524 212 L558 220 L532 299 L480 280 Z" fill="#0891b2" stroke="#67e8f9" stroke-width="4" stroke-linejoin="round"/>
      <!-- Dual LED Cyberpunk Headlights & Clip-on Handlebars -->
      <path d="M536 218 L564 210 M540 226 L566 220" stroke="#fef08a" stroke-width="5" stroke-linecap="round" filter="url(#soft)"/>
      <path d="M496 216 L524 200 H542" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <!-- Racing Canister Exhaust & Plasma Flame Pulse -->
      <path d="M430 292 L468 274 L476 284 L438 302 Z" fill="#334155" stroke="#fbbf24" stroke-width="3"/>
      <path class="exhaust-line" d="M430 297 L406 302" stroke="#f97316" stroke-width="6" stroke-linecap="round" filter="url(#soft)"/>
    </g>
  </g>
  <text x="624" y="115" text-anchor="end" fill="#fde68a" font-family="Consolas, monospace" font-size="12" font-weight="700">06 · YOU ARE HERE</text>
  <text x="624" y="131" text-anchor="end" fill="#f9a8d4" font-family="Consolas, monospace" font-size="11" font-weight="700">AI/ML Ops</text>

  <text x="600" y="335" text-anchor="end" fill="#475569" font-family="Consolas, monospace" font-size="12">next stop: let's collaborate? &#8594;</text>
</svg>
