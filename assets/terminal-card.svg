<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sufiyan terminal introduction</title>
  <desc id="desc">Terminal commands showing Sufiyan's education, focus, and availability</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type-clip-1"><rect class="clip-rect-1" x="250" y="60" width="400" height="28"/></clipPath>
    <clipPath id="type-clip-2"><rect class="clip-rect-2" x="250" y="122" width="400" height="28"/></clipPath>
    <clipPath id="type-clip-3"><rect class="clip-rect-3" x="250" y="184" width="400" height="28"/></clipPath>
    <style>
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke: #334155; }
        33% { stroke: #0891b2; }
        66% { stroke: #7c3aed; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
      }
      /* Prompts sequentially appearing */
      @keyframes promptShow1 {
        0%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes promptShow2 {
        0%, 15% { opacity: 0; }
        17%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes promptShow3 {
        0%, 35% { opacity: 0; }
        37%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes promptShow4 {
        0%, 62% { opacity: 0; }
        64%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      /* Commands typing character-by-character from x=250 */
      @keyframes clipType1 {
        0%, 3% { width: 0px; }
        11%, 94% { width: 80px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal1 {
        0%, 13% { opacity: 0; transform: translateY(3px); }
        16%, 94% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes clipType2 {
        0%, 18% { width: 0px; }
        32%, 94% { width: 210px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal2 {
        0%, 33% { opacity: 0; transform: translateY(3px); }
        36%, 94% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes clipType3 {
        0%, 38% { width: 0px; }
        50%, 94% { width: 150px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal3a {
        0%, 52% { opacity: 0; transform: translateX(-6px); }
        54%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3b {
        0%, 55% { opacity: 0; transform: translateX(-6px); }
        57%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3c {
        0%, 58% { opacity: 0; transform: translateX(-6px); }
        60%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3d {
        0%, 61% { opacity: 0; transform: translateX(-6px); }
        63%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      /* Cursor stepping exactly right after each character */
      @keyframes cursorStep {
        0%, 3% { transform: translate(0px, 0px); opacity: 1; }
        11%, 15% { transform: translate(68px, 0px); opacity: 1; }
        16.5% { transform: translate(0px, 62px); opacity: 1; }
        18% { transform: translate(0px, 62px); opacity: 1; }
        32%, 35% { transform: translate(188px, 62px); opacity: 1; }
        36.5% { transform: translate(0px, 124px); opacity: 1; }
        38% { transform: translate(0px, 124px); opacity: 1; }
        50%, 52% { transform: translate(132px, 124px); opacity: 1; }
        53%, 62% { transform: translate(132px, 124px); opacity: 0; }
        63.5%, 94% { transform: translate(0px, 260px); opacity: 1; }
        96%, 100% { transform: translate(0px, 0px); opacity: 0; }
      }
      .cursor { animation: cursorStep 14s infinite ease-in-out, cursorBlink 0.85s infinite; }
      .card-border { animation: borderPulse 8s infinite ease-in-out; }
      .dot1 { animation: dotPulse 3s infinite 0s ease-in-out; transform-origin: 24px 21px; }
      .dot2 { animation: dotPulse 3s infinite 1s ease-in-out; transform-origin: 44px 21px; }
      .dot3 { animation: dotPulse 3s infinite 2s ease-in-out; transform-origin: 64px 21px; }
      .p-1 { animation: promptShow1 14s infinite ease-out; }
      .clip-rect-1 { animation: clipType1 14s infinite linear; }
      .out-1 { animation: outReveal1 14s infinite ease-out; }
      .p-2 { animation: promptShow2 14s infinite ease-out; }
      .clip-rect-2 { animation: clipType2 14s infinite linear; }
      .out-2 { animation: outReveal2 14s infinite ease-out; }
      .p-3 { animation: promptShow3 14s infinite ease-out; }
      .clip-rect-3 { animation: clipType3 14s infinite linear; }
      .out-3a { animation: outReveal3a 14s infinite ease-out; }
      .out-3b { animation: outReveal3b 14s infinite ease-out; }
      .out-3c { animation: outReveal3c 14s infinite ease-out; }
      .out-3d { animation: outReveal3d 14s infinite ease-out; }
      .p-4 { animation: promptShow4 14s infinite ease-out; }
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#panel)"/>
  <rect class="card-border" x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="640" height="42" rx="18" fill="#1e293b"/>
  <rect y="25" width="640" height="17" fill="#1e293b"/>
  <circle class="dot1" cx="24" cy="21" r="6" fill="#fb7185"/>
  <circle class="dot2" cx="44" cy="21" r="6" fill="#fbbf24"/>
  <circle class="dot3" cx="64" cy="21" r="6" fill="#4ade80"/>
  <text x="320" y="27" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="14">sufiyan@workspace: ~</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="16">
    <text class="p-1" x="28" y="78" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text>
    <g clip-path="url(#type-clip-1)">
      <text x="250" y="78" fill="#f8fafc" font-weight="700">whoami</text>
    </g>
    <text class="out-1" x="28" y="103" fill="#cbd5e1">Mohammad Sufiyan Aasim</text>

    <text class="p-2" x="28" y="140" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text>
    <g clip-path="url(#type-clip-2)">
      <text x="250" y="140" fill="#f8fafc" font-weight="700">cat education.txt</text>
    </g>
    <text class="out-2" x="28" y="165" fill="#cbd5e1">BSE @ Bahria University · AI/ML Focus · Expected 2027</text>

    <text class="p-3" x="28" y="202" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text>
    <g clip-path="url(#type-clip-3)">
      <text x="250" y="202" fill="#f8fafc" font-weight="700">./profile.sh</text>
    </g>
    <g class="out-3a"><text x="28" y="229" fill="#22d3ee">[+]</text><text x="62" y="229" fill="#cbd5e1">SQE Executive · Former CQO (QA Lead) · SDET</text></g>
    <g class="out-3b"><text x="28" y="256" fill="#22d3ee">[+]</text><text x="62" y="256" fill="#cbd5e1">3+ Years QA Experience · SaaS, ERP &amp; Mobile</text></g>
    <g class="out-3c"><text x="28" y="283" fill="#22d3ee">[+]</text><text x="62" y="283" fill="#cbd5e1">Data Sciences · Data Mining · AI/ML Ops</text></g>
    <g class="out-3d"><text x="28" y="310" fill="#a78bfa">[OK]</text><text x="74" y="310" fill="#f8fafc">Open to affiliation work &amp; remote roles</text></g>

    <text class="p-4" x="28" y="338" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text>
    <rect class="cursor" x="250" y="62" width="10" height="20" fill="#67e8f9" filter="url(#glow)"/>
  </g>
</svg>
