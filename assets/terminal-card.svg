<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sufiyan terminal introduction</title>
  <desc id="desc">Terminal commands showing Sufiyan's education, focus, and availability</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="type-clip-1"><rect class="clip-rect-1" x="28" y="60" width="500" height="28"/></clipPath>
    <clipPath id="type-clip-2"><rect class="clip-rect-2" x="28" y="122" width="500" height="28"/></clipPath>
    <clipPath id="type-clip-3"><rect class="clip-rect-3" x="28" y="184" width="500" height="28"/></clipPath>
    <style>
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke: #334155; }
        33% { stroke: #0891b2; }
        66% { stroke: #7c3aed; }
      }
      @keyframes dotPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(0.85); }
      }
      @keyframes clipType1 {
        0%, 3% { width: 0px; }
        11%, 94% { width: 500px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal1 {
        0%, 12% { opacity: 0; transform: translateY(4px); }
        15%, 94% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes clipType2 {
        0%, 20% { width: 0px; }
        31%, 94% { width: 500px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal2 {
        0%, 32% { opacity: 0; transform: translateY(4px); }
        35%, 94% { opacity: 1; transform: translateY(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes clipType3 {
        0%, 43% { width: 0px; }
        54%, 94% { width: 500px; }
        98%, 100% { width: 0px; }
      }
      @keyframes outReveal3a {
        0%, 56% { opacity: 0; transform: translateX(-8px); }
        59%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3b {
        0%, 61% { opacity: 0; transform: translateX(-8px); }
        64%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3c {
        0%, 66% { opacity: 0; transform: translateX(-8px); }
        69%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes outReveal3d {
        0%, 71% { opacity: 0; transform: translateX(-8px); }
        74%, 94% { opacity: 1; transform: translateX(0px); }
        98%, 100% { opacity: 0; }
      }
      @keyframes promptReveal4 {
        0%, 78% { opacity: 0; }
        80%, 94% { opacity: 1; }
        98%, 100% { opacity: 0; }
      }
      @keyframes cursorMove {
        0%, 3% { transform: translate(-232px, -244px); opacity: 1; }
        11%, 20% { transform: translate(-140px, -244px); opacity: 1; }
        21%, 31% { transform: translate(-232px, -182px); opacity: 1; }
        32%, 43% { transform: translate(-60px, -182px); opacity: 1; }
        44%, 54% { transform: translate(-232px, -120px); opacity: 1; }
        55%, 78% { transform: translate(-100px, -120px); opacity: 0; }
        79%, 94% { transform: translate(0px, 0px); opacity: 1; }
        95%, 100% { transform: translate(-232px, -244px); opacity: 0; }
      }
      .cursor { animation: cursorMove 14s infinite ease-in-out, cursorBlink 0.85s infinite; }
      .card-border { animation: borderPulse 8s infinite ease-in-out; }
      .dot1 { animation: dotPulse 3s infinite 0s ease-in-out; transform-origin: 24px 21px; }
      .dot2 { animation: dotPulse 3s infinite 1s ease-in-out; transform-origin: 44px 21px; }
      .dot3 { animation: dotPulse 3s infinite 2s ease-in-out; transform-origin: 64px 21px; }
      .clip-rect-1 { animation: clipType1 14s infinite linear; }
      .out-1 { animation: outReveal1 14s infinite ease-out; }
      .clip-rect-2 { animation: clipType2 14s infinite linear; }
      .out-2 { animation: outReveal2 14s infinite ease-out; }
      .clip-rect-3 { animation: clipType3 14s infinite linear; }
      .out-3a { animation: outReveal3a 14s infinite ease-out; }
      .out-3b { animation: outReveal3b 14s infinite ease-out; }
      .out-3c { animation: outReveal3c 14s infinite ease-out; }
      .out-3d { animation: outReveal3d 14s infinite ease-out; }
      .out-4 { animation: promptReveal4 14s infinite ease-out; }
    </style>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#panel)"/>
  <rect class="card-border" x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="640" height="42" rx="18" fill="#1e293b"/>
  <rect y="25" width="640" height="17" fill="#1e293b"/>
  <circle class="dot1" cx="24" cy="21" r="6" fill="#fb7185"/>
  <circle class="dot2" cx="44" cy="21" r="6" fill="#fbbf24"/>
  <circle class="dot3" cx="64" cy="21" r="6" fill="#4ade80"/>
  <text x="320" y="27" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="14">sufiyan@workspace: ~</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="18">
    <g clip-path="url(#type-clip-1)">
      <text x="28" y="78" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">whoami</tspan></text>
    </g>
    <text class="out-1" x="28" y="103" fill="#cbd5e1">Mohammad Sufiyan Aasim</text>

    <g clip-path="url(#type-clip-2)">
      <text x="28" y="140" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">cat education.txt</tspan></text>
    </g>
    <text class="out-2" x="28" y="165" fill="#cbd5e1">BSE · AI/ML focus · Expected 2027</text>

    <g clip-path="url(#type-clip-3)">
      <text x="28" y="202" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">./profile.sh</tspan></text>
    </g>
    <g class="out-3a"><text x="28" y="229" fill="#22d3ee">[+]</text><text x="62" y="229" fill="#cbd5e1">SQA Analyst &#8594; SQA Engineer &#8594; SDET</text></g>
    <g class="out-3b"><text x="28" y="256" fill="#22d3ee">[+]</text><text x="62" y="256" fill="#cbd5e1">Data Sciences · Data Mining · AI/ML Ops</text></g>
    <g class="out-3c"><text x="28" y="283" fill="#22d3ee">[+]</text><text x="62" y="283" fill="#cbd5e1">English · Urdu · Karachi</text></g>
    <g class="out-3d"><text x="28" y="310" fill="#a78bfa">[OK]</text><text x="78" y="310" fill="#f8fafc">Open to affiliation work</text></g>
    <g class="out-4"><text x="28" y="338" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text></g>
    <rect class="cursor" x="260" y="322" width="10" height="20" fill="#67e8f9" filter="url(#glow)"/>
  </g>
</svg>
