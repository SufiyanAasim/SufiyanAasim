<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Sufiyan terminal introduction</title>
  <desc id="desc">Terminal commands showing Sufiyan's education, focus, and availability</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="360" rx="18" fill="url(#panel)"/>
  <rect x="1" y="1" width="638" height="358" rx="17" fill="none" stroke="#334155" stroke-width="2"/>
  <rect width="640" height="42" rx="18" fill="#1e293b"/>
  <rect y="25" width="640" height="17" fill="#1e293b"/>
  <circle cx="24" cy="21" r="6" fill="#fb7185"/>
  <circle cx="44" cy="21" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="21" r="6" fill="#4ade80"/>
  <text x="320" y="27" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="14">sufiyan@workspace: ~</text>
  <g font-family="Consolas, 'Courier New', monospace" font-size="18">
    <text x="28" y="78" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">whoami</tspan></text>
    <text x="28" y="103" fill="#cbd5e1">Mohammad Sufiyan Aasim</text>

    <text x="28" y="140" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">cat education.txt</tspan></text>
    <text x="28" y="165" fill="#cbd5e1">BSE · AI/ML focus · Expected 2027</text>

    <text x="28" y="202" fill="#4ade80" font-weight="700">sufiyan@workspace:~$ <tspan fill="#f8fafc">./profile.sh</tspan></text>
    <text x="28" y="229" fill="#22d3ee">[+]</text><text x="62" y="229" fill="#cbd5e1">SQA Analyst &#8594; SQA Engineer</text>
    <text x="28" y="256" fill="#22d3ee">[+]</text><text x="62" y="256" fill="#cbd5e1">Data Sciences · Data Mining · AI/ML Ops</text>
    <text x="28" y="283" fill="#22d3ee">[+]</text><text x="62" y="283" fill="#cbd5e1">English · Urdu · Karachi</text>
    <text x="28" y="310" fill="#a78bfa">[OK]</text><text x="78" y="310" fill="#f8fafc">Open to affiliation work</text>
    <text x="28" y="338" fill="#4ade80" font-weight="700">sufiyan@workspace:~$</text>
    <rect x="260" y="322" width="10" height="20" fill="#67e8f9" filter="url(#glow)"/>
  </g>
</svg>
